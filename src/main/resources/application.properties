# application config
spring.application.name=Prueba tecnica - Banco Hipotecario

# logging
logging.level.com.fsole.bh=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] [%highlight(%level)] %cyan(%logger{36}) - %msg%n

# monitoring
management.endpoints.web.exposure.include=*
management.info.env.enabled=true
management.info.build.enabled=true
management.info.git.enabled=true
info.app.name=Banco Hipotecario API
info.app.description=technical test on an API that consumes an external API and merges the information